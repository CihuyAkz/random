/* Responsive landscape and portrait support */
@media (orientation: landscape) and (max-height: 600px) {
  :root { --sidebar: 205px; }
  .sidebar { width: var(--sidebar); }
  .main { margin-left: var(--sidebar); }
  .sidebar-inner { padding-top: 12px; padding-bottom: 12px; }
  .brand { min-height: 58px; }
  .nav-group { margin-top: 12px; }
  .nav-link { min-height: 36px; padding-top: 8px; padding-bottom: 8px; }
  .topbar { height: 54px; }
  .content { padding: 18px 24px 26px; }
  .page-head { margin-bottom: 14px; }
  .hero { min-height: 220px; padding: 20px 24px; }
  .hero h2 { font-size: clamp(22px, 3.5vw, 32px); }
  .hero-world { max-height: 220px; }
  .horizon-launch-screen { min-height: calc(100svh - 75px); padding-top: 12px; padding-bottom: 12px; }
  .first-run-panel { width: min(900px, 100%); max-height: calc(100svh - 16px); padding: 16px 20px; }
  .first-run-logo { width: min(340px, 42vw); max-height: 72px; object-fit: contain; margin-bottom: 8px; }
  .first-run-panel h1 { font-size: 21px; margin: 5px 0; }
  .first-run-panel > p { margin-bottom: 10px; }
  .setup-version-row { margin: 10px 0; padding: 8px 12px; }
  .setup-details { grid-template-columns: repeat(3, minmax(0,1fr)); margin: 9px 0; }
  .setup-log { height: 90px; }
  .setup-log-panel { margin: 9px 0; }
  .first-run-progress-wrap { margin: 10px 0; }
  .mobile-menu { display: none; }
}
@media (orientation: landscape) and (max-height: 600px) and (max-width: 900px) {
  :root { --sidebar: 68px; }
  .sidebar { width: var(--sidebar); }
  .main { margin-left: var(--sidebar); }
  .brand-name, .nav-group-title, .nav-link span, .sidebar-footer .account-copy { display: none; }
  .brand { justify-content: center; padding: 10px 4px; }
  .brand-logo { max-width: 42px; }
  .nav-link { justify-content: center; padding: 10px 4px; }
  .sidebar-footer { justify-content: center; }
  .sidebar-footer .account-avatar { margin: 0; }
  .content { padding: 14px 16px 20px; }
  .grid.four, .content-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .hero { min-height: 190px; }
}
@media (orientation: portrait) {
  .content { min-width: 0; }
  .main, .app-shell { min-width: 0; }
  img, svg, canvas { max-width: 100%; }
}
@media (max-width: 760px) and (orientation: portrait) {
  .mobile-menu { display: grid; }
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
}


/* Responsive navigation fix */
.sidebar{
  box-sizing:border-box;
  height:100vh;
  height:100dvh;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:var(--surface-3) transparent;
}
.sidebar-spacer{flex:0 0 14px;min-height:14px}
.sidebar-bottom{flex:0 0 auto;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.nav-label,.nav-list,.sidebar-card,.brand{flex-shrink:0}
.mobile-overlay{z-index:19;touch-action:pan-y}
@media (max-width:900px), (max-height:560px) and (pointer:coarse){
  :root{--sidebar:min(290px,82vw)}
  .sidebar{
    position:fixed;top:0;bottom:0;left:0;
    width:var(--sidebar);height:100vh;height:100dvh;
    padding-top:max(18px,env(safe-area-inset-top));
    padding-bottom:max(14px,env(safe-area-inset-bottom));

/* Smooth page-entry transition when switching launcher menus */
@keyframes horizonPageEnter {
  from { opacity:0; transform:translate3d(0,12px,0) scale(.995); filter:blur(2px); }
  to { opacity:1; transform:translate3d(0,0,0) scale(1); filter:blur(0); }
}
.content.page-enter { animation:horizonPageEnter 340ms cubic-bezier(.2,.72,.25,1) both; transform-origin:50% 12%; }
@media (prefers-reduced-motion: reduce) {
  .content.page-enter { animation:none; }
}

const WORLD_DB_NAME='horizon-world-files',WORLD_DB_STORE='files';
function openWorldDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error('IndexedDB is unavailable.'));return}const req=indexedDB.open(WORLD_DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(WORLD_DB_STORE))req.result.createObjectStore(WORLD_DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Could not open world storage.'))})}
async function saveWorldBlob(id,blob){const db=await openWorldDb();return new Promise((resolve,reject)=>{const tx=db.transaction(WORLD_DB_STORE,'readwrite');tx.objectStore(WORLD_DB_STORE).put(blob,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error||new Error('Could not save world file.'))}})}
async function getWorldBlob(id){if(!id)return null;const db=await openWorldDb();return new Promise((resolve,reject)=>{const tx=db.transaction(WORLD_DB_STORE,'readonly');const req=tx.objectStore(WORLD_DB_STORE).get(id);req.onsuccess=()=>{db.close();resolve(req.result||null)};req.onerror=()=>{db.close();reject(req.error||new Error('Could not read world file.'))}})}
async function deleteWorldBlob(id){if(!id)return;try{const db=await openWorldDb();await new Promise((resolve,reject)=>{const tx=db.transaction(WORLD_DB_STORE,'readwrite');tx.objectStore(WORLD_DB_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Could not remove world file.'))});db.close()}catch{}}
function crc32(bytes){let crc=0xffffffff;for(const byte of bytes){crc^=byte;for(let i=0;i<8;i++)crc=(crc>>>1)^(0xedb88320&-(crc&1))}return (crc^0xffffffff)>>>0}
function zipStored(entries){const enc=new TextEncoder(),parts=[],central=[];let offset=0;const u16=n=>new Uint8Array([n&255,(n>>>8)&255]),u32=n=>new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]);for(const entry of entries){const name=enc.encode(entry.name),data=entry.data instanceof Uint8Array?entry.data:new Uint8Array(entry.data),crc=crc32(data);const local=new Uint8Array(30+name.length+data.length);const lv=new DataView(local.buffer);lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x800,true);lv.setUint16(8,0,true);lv.setUint32(14,0,true);lv.setUint32(18,crc,true);lv.setUint32(22,data.length,true);lv.setUint32(26,data.length,true);lv.setUint16(28,name.length,true);local.set(name,30);local.set(data,30+name.length);parts.push(local);const dir=new Uint8Array(46+name.length),dv=new DataView(dir.buffer);dv.setUint32(0,0x02014b50,true);dv.setUint16(4,20,true);dv.setUint16(6,20,true);dv.setUint16(8,0x800,true);dv.setUint16(10,0,true);dv.setUint32(16,0,true);dv.setUint32(20,crc,true);dv.setUint32(24,data.length,true);dv.setUint32(28,data.length,true);dv.setUint16(32,name.length,true);dv.setUint32(42,offset,true);dir.set(name,46);central.push(dir);offset+=local.length}const cdOffset=offset,cdSize=central.reduce((n,x)=>n+x.length,0),end=new Uint8Array(22),ev=new DataView(end.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,entries.length,true);ev.setUint16(10,entries.length,true);ev.setUint32(12,cdSize,true);ev.setUint32(16,cdOffset,true);return new Blob([...parts,...central,end],{type:'application/zip'})}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function exportWorld(name,imported){try{if(imported){const item=(state.imported.worlds||[]).find(x=>x.name===name);const blob=await getWorldBlob(item?.blobId);if(blob){downloadBlob(blob,`${String(name).replace(/[^a-z0-9_-]+/gi,'_')}.zip`);toast('World exported as ZIP');return}}const item=(contentLibrary.worlds||[]).find(x=>x.name===name);if(!item)return;const manifest={name:item.name,description:item.desc,version:item.version,size:item.size,exportedAt:new Date().toISOString(),simulation:true};const readme=`Horizon Android simulated world export\n\nWorld: ${item.name}\nThis ZIP is a launcher simulation export and does not contain a real Minecraft world save.`;const zip=zipStored([{name:'world.json',data:new TextEncoder().encode(JSON.stringify(manifest,null,2))},{name:'README.txt',data:new TextEncoder().encode(readme)}]);downloadBlob(zip,`${String(name).replace(/[^a-z0-9_-]+/gi,'_')}.zip`);toast('World exported as ZIP')}catch(err){toast(err.message||'World export failed.')}}

function translateLanguageValue(value,dict){
 const trimmed=value.trim();
 if(Object.prototype.hasOwnProperty.call(dict,trimmed))return value.replace(trimmed,dict[trimmed]);
 let translated=value;
 const keys=Object.keys(dict).filter(key=>key.includes(' ')||key.includes('·')||key.endsWith(':')||key.endsWith(',')||key.length>=28).sort((a,b)=>b.length-a.length);
 for(const key of keys)if(translated.includes(key))translated=translated.split(key).join(dict[key]);
 return translated;
}
const languageTextSources=new WeakMap();
const languageAttributeSources=new WeakMap();
function translateLanguageNode(root,dict){
 if(!root)return;
 const translateTextNode=node=>{
  if(node.parentElement?.closest('script,style'))return;
  const current=node.nodeValue,cached=languageTextSources.get(node);
  const source=cached&&current===cached.rendered?cached.source:current;
  const translated=translateLanguageValue(source,dict);
  languageTextSources.set(node,{source,rendered:translated});
  if(translated!==current)node.nodeValue=translated;
 };
 if(root.nodeType===Node.TEXT_NODE){translateTextNode(root);return}
 if(root.nodeType!==Node.ELEMENT_NODE&&root.nodeType!==Node.DOCUMENT_FRAGMENT_NODE)return;
 if(root.nodeType===Node.ELEMENT_NODE&&['SCRIPT','STYLE'].includes(root.tagName))return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 let node;while(node=walker.nextNode())translateTextNode(node);
 const selector='[placeholder],[title],[aria-label],[alt]';
 const elements=[];
 if(root.nodeType===Node.ELEMENT_NODE&&root.matches(selector))elements.push(root);
 if(root.querySelectorAll)elements.push(...root.querySelectorAll(selector));
 for(const element of elements){
  const cached=languageAttributeSources.get(element)||{};
  for(const attr of ['placeholder','title','aria-label','alt'])if(element.hasAttribute(attr)){
   const current=element.getAttribute(attr),entry=cached[attr];
   const source=entry&&current===entry.rendered?entry.source:current;
   const translated=translateLanguageValue(source,dict);
   cached[attr]={source,rendered:translated};
   if(translated!==current)element.setAttribute(attr,translated);
  }
  languageAttributeSources.set(element,cached);
 }
}

function applyLanguage(){
 const lang=state.settings.language==='Bahasa Indonesia'?'Bahasa Indonesia':'English';
 document.documentElement.lang=lang==='English'?'en':'id';
 translateLanguageNode(document.body,UI_TRANSLATIONS[lang]);
}
const uiLanguageObserver=new MutationObserver(records=>{
 const lang=state.settings.language==='Bahasa Indonesia'?'Bahasa Indonesia':'English';
 const dict=UI_TRANSLATIONS[lang];
 for(const record of records){if(record.type==='characterData')translateLanguageNode(record.target,dict);else record.addedNodes.forEach(node=>translateLanguageNode(node,dict))}
});
uiLanguageObserver.observe(document.body,{childList:true,subtree:true,characterData:true});

function formatBootstrapBytes(value){
 const bytes=Math.max(0,Number(value)||0);
 if(bytes<1000)return `${Math.round(bytes)} B`;
 if(bytes<1000000)return `${(bytes/1000).toFixed(bytes<10000?1:0)} KB`;
 return `${(bytes/1000000).toFixed(bytes<100000000?1:0)} MB`;
}
function appendBootstrapLog(message,level='info'){
 const box=document.getElementById('firstRunLog');
 if(!box)return;
 const stamp=new Date().toLocaleTimeString(uiLocale(),{hour12:false});
 const line=document.createElement('span');
 line.className=level==='error'?'error':level==='success'?'success':level==='warn'?'warn':'';
 line.textContent=`\n[${stamp}] ${String(message??'').slice(0,1200)}`;
 box.appendChild(line);
 while(box.childNodes.length>500)box.removeChild(box.firstChild);
 box.scrollTop=box.scrollHeight;
}
function updateBootstrapProgress(data={}){
 const downloaded=Number(data.downloadedBytes??data.bytesDownloaded??0)||0;
 const total=Number(data.totalBytes??data.bytesTotal??0)||0;
 const percent=total>0?Math.min(100,downloaded/total*100):0;
 const bar=document.getElementById('firstRunProgress');
 if(bar)bar.style.width=percent+'%';
 const bytes=document.getElementById('firstRunBytes');
 if(bytes)bytes.textContent=`${formatBootstrapBytes(downloaded)} / ${total?formatBootstrapBytes(total):'--'}`;
 const pct=document.getElementById('firstRunPercent');
 if(pct)pct.textContent=total?`${percent.toFixed(1)}%`:'—';
 const status=document.getElementById('firstRunStatus');
 if(status)status.textContent=data.status||data.stage||'Downloading assets';
 const files=document.getElementById('firstRunFiles');
 if(files)files.textContent=`${Number(data.filesDone??data.completedFiles??0)||0} / ${data.totalFiles??'--'} files`;
 const current=document.getElementById('firstRunCurrentFile');
 if(current)current.textContent=data.currentFile||data.file||'Downloading...';
 const phase=document.getElementById('firstRunPhase');
 if(phase)phase.textContent=data.stage||data.phase||'Downloading';
 const speed=Number(data.speedBytesPerSec??data.bytesPerSecond??0)||0;
 const speedText=speed?`${formatBootstrapBytes(speed)}/s`:'—';
 const speedEl=document.getElementById('firstRunSpeed');
 if(speedEl)speedEl.textContent=speed?speedText:'Calculating speed';
 const speedDetail=document.getElementById('firstRunSpeedDetail');
 if(speedDetail)speedDetail.textContent=speedText;
 const tag=document.getElementById('firstRunSetupTag');
 if(tag)tag.textContent='DOWNLOADING';
}
function completeBootstrap(data={}){

 if(bar)bar.style.width='100%';
 const pct=document.getElementById('firstRunPercent');

function failBootstrap(message){
 const button=document.getElementById('firstRunDownload');
 if(button){button.disabled=false;button.dataset.running='0';button.innerHTML=`${ico('refresh',18)} Retry Download`;}
 const tag=document.getElementById('firstRunSetupTag');
 if(tag)tag.textContent='SETUP BLOCKED';

 if(msg)msg.textContent=String(message||'Download service is not available.');
 appendBootstrapLog(message||'Download failed.', 'error');
}
window.horizonBootstrapLog=(message,level='info')=>appendBootstrapLog(message,level);
window.horizonBootstrapProgress=data=>updateBootstrapProgress(data||{});
window.horizonBootstrapComplete=data=>completeBootstrap(data||{});
window.horizonBootstrapError=message=>failBootstrap(message);
function handleBootstrapEvent(event){
 if(!event||typeof event!=='object')return;
 const type=String(event.type||event.event||'').toLowerCase();
 if(type==='log')appendBootstrapLog(event.message||event.text||'',event.level||'info');
 else if(type==='progress'||type==='file-progress'||type==='start'){
  if(type==='start')appendBootstrapLog(event.message||'Download queue received.');
  updateBootstrapProgress(event);
 }
 else if(type==='file-complete'){
  appendBootstrapLog(event.message||`Downloaded ${event.file||event.path||'file'}.`, 'success');
  updateBootstrapProgress(event);
 }
 else if(type==='complete'||type==='done')completeBootstrap(event);
 else if(type==='error')failBootstrap(event.message||'Bootstrap service returned an error.');
}
async function runBootstrapEndpoint(endpoint){
 const url=endpoint.replace(/\/$/,'')+(window.HORIZON_CONFIG.bootstrapPath||'/api/launcher/bootstrap');
 const response=await fetch(url,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','Accept':'application/x-ndjson, application/json'},body:JSON.stringify({version:window.HORIZON_CONFIG.minecraftVersion,platform:'android',components:['version-metadata','client','libraries','assets','java-runtime','android-natives']})});
 if(!response.ok)throw new Error(`Bootstrap API returned HTTP ${response.status}`);
 const type=(response.headers.get('content-type')||'').toLowerCase();
 if(!response.body||!response.body.getReader){
  const data=await response.json();
  if(Array.isArray(data.events))data.events.forEach(handleBootstrapEvent);else handleBootstrapEvent(data);
  if(data.status==='complete'||data.type==='complete')return;
  throw new Error('Bootstrap API did not return a streaming response.');
 }
 const reader=response.body.getReader();
 const decoder=new TextDecoder();
 let buffer='';
 let completed=false;
 while(true){
  const {value,done}=await reader.read();
  if(done)break;
  buffer+=decoder.decode(value,{stream:true});
  const lines=buffer.split(/\r?\n/);
  buffer=lines.pop()||'';
  for(const line of lines){
   if(!line.trim())continue;
   const event=JSON.parse(line);
   handleBootstrapEvent(event);
   if(['complete','done'].includes(String(event.type||event.event||'').toLowerCase()))completed=true;
   if(String(event.type||event.event||'').toLowerCase()==='error')throw new Error(event.message||'Bootstrap failed.');
  }
 }
 buffer+=decoder.decode();
 if(buffer.trim()){

document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(target){if(target.dataset.action==='backdrop-close'&&e.target!==target)return;e.preventDefault();doAction(target)}});

document.addEventListener('change',async e=>{if(e.target.id==='themeImageInput'){const file=e.target.files?.[0];if(file){if(!file.type.startsWith('image/')){toast('Please choose an image file');return}if(file.size>5*1024*1024){toast('Image must be 5 MB or smaller');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const scale=Math.min(1,1920/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);state.customBackground=canvas.toDataURL('image/jpeg',.78);try{localStorage.setItem('horizon-custom-background',state.customBackground);state.theme='custom';state.settings.themeMode='Custom image';saveStore();render();toast('Custom background applied')}catch(err){toast('Image is too large to save in browser storage')}};img.src=reader.result};reader.readAsDataURL(file)}e.target.value=''}if(e.target.matches('[data-action="gradient-color"]')){state.settings[e.target.dataset.key]=e.target.value;const a=state.settings.gradientA||'#17102a',b=state.settings.gradientB||'#102b3b';document.body.style.backgroundImage=`linear-gradient(135deg,${a},${b})`;saveStore()}if(e.target.id==='libraryFileInput'){const type=e.target.dataset.type;const files=Array.from(e.target.files||[]);if(files.length){state.imported[type]=state.imported[type]||[];for(const f of files){const item={name:f.name.replace(/\.zip$/i,''),size:f.size<1048576?(f.size/1024).toFixed(1)+' KB':(f.size/1048576).toFixed(2)+' MB',date:new Date().toLocaleDateString(uiLocale()),desc:type==='worlds'?'Imported world save':'Imported file',version:type==='worlds'?'Imported':'—',tag:type==='worlds'?'World':'Imported'};if(type==='worlds'){item.blobId=`world-${Date.now()}-${Math.random().toString(36).slice(2,10)}`;try{await saveWorldBlob(item.blobId,f)}catch(err){toast(err.message||'World file could not be stored.');continue}}state.imported[type].push(item)}saveStore();render();toast(`${files.length} file imported to local index`)}e.target.value=''}});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch'||e.target.id==='pageSearch'){state.search=e.target.value;const start=e.target.selectionStart;const end=e.target.selectionEnd;render();const next=document.getElementById(e.target.id);if(next){next.focus();next.setSelectionRange(start,end)}}if(e.target.matches('[data-action="setting-range"]')){const out=document.getElementById('range-'+e.target.dataset.key);if(out)out.textContent=e.target.dataset.key==='resolution'?'Resolusi: '+Number(e.target.value)+'%':(Number(e.target.value)/1024).toFixed(1)+' GB'}});
document.addEventListener('change',e=>{if(e.target.matches('[data-action="setting-select"]')){const key=e.target.dataset.key;if(state.settings[key]!==e.target.value){state.settings[key]=e.target.value;if(key==='themeMode')state.theme=({'Dark':'dark','Light':'light','OLED':'oled','Gradient':'gradient','Custom image':'custom'})[e.target.value]||'dark';saveStore();render();toast('Preference saved')}}if(e.target.matches('[data-action="setting-text"]')){state.settings[e.target.dataset.key]=e.target.value;saveStore() }if(e.target.matches('[data-action="setting-range"]')){state.settings[e.target.dataset.key]=Number(e.target.value);saveStore()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch')?.focus()}if(e.key==='Escape'&&state.modal)closeModal();if(e.key==='Enter'&&e.target.id==='globalSearch'){e.preventDefault()}if(e.key==='Enter'&&e.target.id==='downloadQuery'){e.preventDefault();searchDownloads()}});
render();
showFirstRun();
</script>
</body>
</html>
